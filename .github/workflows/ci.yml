name: Validate and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job may write, and only on a tag.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a full commit SHA: a moved or hijacked tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/marketplace.json plugins/stayrank/.claude-plugin/plugin.json plugins/stayrank/.mcp.json plugins/stayrank/.openai/plugin.json plugins/stayrank/.openai/mcp.json; do
            python -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: Validate the Claude plugin and marketplace (official CLI, pinned version)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.292
          claude plugin validate ./plugins/stayrank --strict
          claude plugin validate . --strict

      - name: Build both packages (ChatGPT package checked against OpenAI's rules)
        run: python scripts/package.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stayrank-plugins
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build both packages
        run: python scripts/package.py

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/stayrank-chatgpt.zip dist/stayrank-claude.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Stayrank $TAG" \
            --notes "Plugin packages for ChatGPT (stayrank-chatgpt.zip) and Claude (stayrank-claude.zip). Server: https://www.stayrank.ai/api/mcp" \
            || gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
