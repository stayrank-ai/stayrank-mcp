name: Validate and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job may write, and only on a tag.
permissions:
  contents: read

jobs:
  build:
    # A fixed image: no silent change of runner under the build.
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned to a full commit SHA: a moved or hijacked tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Validate JSON manifests
        run: |
          for f in package.json .claude-plugin/marketplace.json plugins/stayrank/.claude-plugin/plugin.json plugins/stayrank/.mcp.json plugins/stayrank/.openai/plugin.json plugins/stayrank/.openai/mcp.json; do
            python -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      # Exact versions and integrity hashes from package-lock.json; the audit fails the build on any known vulnerability.
      - name: Install the pinned validation tooling
        run: |
          npm ci --no-fund
          npm audit --audit-level=low

      - name: Validate the Claude plugin and marketplace (official CLI)
        env:
          # The CLI prints Node deprecation notices from its own bundle; they are not about this repository.
          NODE_OPTIONS: --no-deprecation
        run: npm run validate

      - name: Build both packages (ChatGPT package checked against OpenAI's rules)
        run: python scripts/package.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stayrank-plugins
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build both packages
        run: python scripts/package.py

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/stayrank-chatgpt.zip dist/stayrank-claude.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Stayrank $TAG" \
            --notes "Plugin packages for ChatGPT (stayrank-chatgpt.zip) and Claude (stayrank-claude.zip). Server: https://www.stayrank.ai/api/mcp" \
            || gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
